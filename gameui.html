<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade UI</title>
    <style>
       
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        
        .arcade-monitor {
            position: relative;
            width: 90vw;
            max-width: 800px;
            height: 80vh;
            max-height: 600px;
            background: radial-gradient(circle, #1a0b2e 0%, #07020d 100%);
            border: 20px solid #222;
            border-radius: 15px;
            box-shadow: 
                0 0 0 10px #444, 
                0 20px 50px rgba(0,0,0,0.8),
                inset 0 0 40px rgba(255, 0, 128, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
        }

       
        .arcade-monitor::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

       
        .hud-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 4px dashed #3498db;
            padding-bottom: 15px;
        }

        .score-val {
            color: #2ecc71;
            margin-top: 8px;
        }

        .high-score {
            text-align: center;
        }

        .high-score .score-val {
            color: #e74c3c;
        }

       
        .title-container {
            text-align: center;
            margin: 20px 0;
        }

        .game-title {
            font-size: 42px;
            color: #f1c40f;
            text-shadow: 4px 4px 0px #c0392b, 8px 8px 0px #000;
            letter-spacing: 4px;
            animation: pulse 1.5s infinite alternate;
        }

        
        .menu-options {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .menu-item {
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            background: transparent;
            border: none;
            font-family: inherit;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.1s ease;
            position: relative;
        }

        
        .menu-item:hover {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.6);
        }

        .menu-item:hover::before {
            content: "▶";
            position: absolute;
            left: -20px;
            color: #00ffff;
            animation: blink 0.6s infinite alternate;
        }

        
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 4px dashed #3498db;
            padding-top: 15px;
            font-size: 12px;
            color: #bdc3c7;
        }

        .insert-coin {
            color: #f39c12;
            animation: blink 0.8s infinite alternate;
        }

       
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        @keyframes blink {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    
    <main class="arcade-monitor">
        
        
        <header class="hud-bar">
            <div class="player-score">
                <p>1UP</p>
                <p class="score-val">002450</p>
            </div>
            <div class="high-score">
                <p>HIGH SCORE</p>
                <p class="score-val">999990</p>
            </div>
            <div class="player-stage">
                <p>STAGE</p>
                <p class="score-val" style="color: #9b59b6;">01</p>
            </div>
        </header>

        
        <section class="title-container">
            <h1 class="game-title">NEON<br>RUSH</h1>
        </section>

        
        <nav class="menu-options">
            <button class="menu-item">START GAME</button>
            <button class="menu-item">OPTIONS</button>
            <button class="menu-item">CREDITS</button>
        </nav>

        
        <footer class="footer-bar">
            <div>© 198X ARCADE CORP</div>
            <div class="insert-coin">INSERT COIN</div>
            <div>CREDIT 01</div>
        </footer>

    </main>

</body>
</html>
